<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3328">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DUGOUT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-32.png">
<title>DUGOUT｜ソフトボール オーダー管理</title>
<style>
:root{--main:#1b4d3e;--gold:#b8973a;--sub:#e9f0eb;--box:#f7f9f6;--boxl:#d5ddd5;--line:#cfd8d1;--err:#c0392b;--warn:#b9770e;--ok:#1e8449}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#f4f6f9;color:#222;font-size:15px;
 padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{background:var(--main);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:17px}
header .g{font-size:12px;opacity:.85;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:#666}
nav button.on{color:var(--main);font-weight:bold;box-shadow:inset 0 3px 0 var(--main)}
main{padding:8px 10px;max-width:760px;margin:0 auto}
section.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;padding-left:8px;border-left:4px solid var(--main)}
label{display:block;font-size:12px;color:#555;margin-bottom:8px}
input,select,textarea{font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff;color:#222}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:inline-block;border:1px solid var(--main);background:var(--main);color:#fff;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.w{background:#fff;color:var(--main)}
.btn.r{background:#fff;color:var(--err);border-color:var(--err)}
.btn.s{padding:4px 8px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
th{font-size:12px;color:#555;background:var(--sub)}
.num{width:38px;text-align:center;font-weight:bold}
.msg{padding:8px 10px;border-radius:6px;font-size:13px;margin-top:8px}
.msg.err{background:#fdecea;color:var(--err)}
.msg.warn{background:#fef5e7;color:var(--warn)}
.msg.ok{background:#e9f7ef;color:var(--ok)}
.muted{color:#888;font-size:12px}
.order td select{padding:6px 4px}
.mv{display:flex;gap:2px}.mv button{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:32px;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;background:var(--sub);color:var(--main);margin-left:4px}
.tag.out{background:#eee;color:#999}
.tag.re{background:#fef5e7;color:var(--warn)}
.bench span{display:inline-block;margin:0 6px 6px 0;padding:4px 8px;background:var(--sub);border-radius:6px;font-size:13px}
.field{max-width:420px;margin:0 auto;display:block}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:20}
/* ===== オーダー画面（1画面） ===== */
header{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;border-bottom:2px solid var(--gold);display:flex;align-items:baseline;gap:10px}
header h1{font-size:18px;white-space:nowrap;letter-spacing:.12em;font-weight:800}
header h1 small{font-size:10px;letter-spacing:0;font-weight:normal;opacity:.75;margin-left:6px}
header .g{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar{display:flex;gap:6px;margin-bottom:6px}
.gbar button,.gbar select{height:34px}
.p .un{color:#d0a0a0;font-weight:normal}
.gbar select{flex:1;font-size:14px;padding:6px}
.gbar button{flex:0 0 auto;border:1px solid var(--main);background:#fff;color:var(--main);border-radius:6px;padding:0 10px;font-size:13px}
.gbar button:disabled{opacity:.35}
.fld{position:relative;height:200px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.fld svg{position:absolute;inset:0;width:100%;height:100%}
.pbox{position:absolute;width:31%;height:34px;transform:translate(-50%,-50%);background:var(--box);border:1px solid var(--boxl);border-radius:4px;
 padding:2px 4px;text-align:center;line-height:1.15;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.pbox .pl{font-size:9px;color:var(--main);font-weight:bold}
.pbox .pn{font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbox .pn small{font-weight:normal;color:#777;font-size:10px;margin-left:2px}
.pbox.empty .pn{color:#bbb}
.dpnote{position:absolute;left:6px;bottom:4px;font-size:11px;color:var(--main);font-weight:bold}
.ls{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.lh,.lr{display:grid;grid-template-columns:38px 46px 1fr 50px;align-items:center}
.lh{background:var(--main);color:#fff;font-size:12px;font-weight:bold;border-bottom:2px solid var(--gold);height:26px}
.lh div,.lr>div{text-align:center}
.lh div:nth-child(3){text-align:left;padding-left:10px}
.lr{height:29px;border-bottom:1px solid var(--line)}
.lr .o{font-weight:bold;color:var(--main);font-size:15px}
.lr .p{font-size:14px;font-weight:bold;color:var(--main);border-left:1px solid var(--line);height:100%;display:flex;align-items:center;justify-content:center}
.lr .n{text-align:left;padding:0 4px;height:100%;display:flex;align-items:center}
.lr .n span{display:block;width:100%;background:var(--box);border:1px solid var(--boxl);border-radius:4px;padding:2px 8px;font-size:15px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.lr .n span.empty{color:#bbb}
.lr .b{font-size:14px}
.lr.bn .o{font-size:12px;color:#888}
.lsep{background:var(--sub);color:var(--main);font-size:11px;font-weight:bold;padding:3px 10px;border-bottom:1px solid var(--line);border-top:1px solid var(--main)}
.sel{outline:2px solid var(--gold)!important;background:#fff6dc!important}
.over{background:#dcebdf!important}
.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;background:#fff;border:2px solid var(--gold);border-radius:6px;padding:4px 10px;font-weight:bold;
 box-shadow:0 4px 12px rgba(0,0,0,.25);transform:translate(-50%,-130%);font-size:15px;white-space:nowrap}
.hint{font-size:11px;color:#777;margin:6px 2px 0;line-height:1.5}
.pbox.dpb{border-style:dashed;border-color:var(--gold)}
.fpt{display:inline-block;margin-left:3px;background:var(--gold);color:#fff;border-radius:3px;padding:0 3px;font-size:8px;vertical-align:1px}
.gbar .dpbtn{font-size:12px;padding:0 8px}
.gbar .dpbtn.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold}
.trt td{padding:3px 4px}.trt .btn{padding:4px 8px}
details.slog{margin-top:10px}
details.slog summary{font-size:14px;font-weight:bold;color:var(--main);padding:8px 4px;cursor:pointer}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.bchip{position:relative;background:var(--box);border:1px solid var(--boxl);border-radius:4px;height:32px;display:flex;align-items:center;justify-content:center;
 font-size:15px;font-weight:bold;white-space:nowrap;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.bchip small{font-weight:normal;color:#888;font-size:11px;margin-left:3px}
.bchip .bt{position:absolute;top:0;right:0;font-style:normal;font-size:9px;font-weight:normal;background:#fff6dc;color:#8a6d1c;padding:0 3px;border-radius:0 3px 0 4px;line-height:13px}
.bchip .bt.gr{background:#eee;color:#999}
.bchip.no{color:#aaa}
.bchip.re{border-color:#d9c48a}
.olist{font-size:12px;padding:6px 8px;margin-top:6px;border-radius:6px}
.lr .p span{display:flex;align-items:center;justify-content:center;width:36px;height:24px;border:1px dashed transparent;border-radius:4px;
 touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.lr:not(.bn) .p span{border-color:var(--boxl);background:var(--box)}
.lr .p span.un{color:#d0a0a0;font-weight:normal}
.tg{font-style:normal;font-size:10px;background:#fff6dc;color:#8a6d1c;border-radius:8px;padding:0 5px;margin-left:6px;vertical-align:2px}
.tg.gr{background:#eee;color:#999}
.lr.no .n span{color:#aaa}
.ls.live .lh{background:#6b1f1f}
.seg{display:flex;flex:1;border:1px solid var(--main);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0!important;border-radius:0!important;background:#fff;color:var(--main);font-size:13px;padding:0}
.seg button.on{background:var(--main);color:#fff;font-weight:bold}
.inn{display:flex;align-items:center;gap:4px}
.inn b{font-size:14px;min-width:34px;text-align:center}
.inn button{width:32px;padding:0!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ask{background:#fff;width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.ask .at{font-size:16px;text-align:center}.ask .am{font-size:12px;color:#777;text-align:center;margin-bottom:4px}
.ask .btn{padding:12px;font-size:16px}
.sheet h3{text-align:center;margin:0 0 4px;font-size:18px}
.sheet .info{text-align:center;font-size:13px;margin-bottom:8px}
.sheet table th,.sheet table td{border:1px solid #888;text-align:center;padding:6px}
.sheet td.nm{text-align:left}
@media print{
 header,nav,.noprint,#toast{display:none!important}
 body{background:#fff;padding:0;font-size:12pt}
 main{max-width:none;padding:0}
 section.card{border:0;padding:0;margin:0 0 10mm}
 @page{size:A4 portrait;margin:15mm}
}

/* ===== デザイン刷新 ===== */
:root{--deep:#0f3328;--main:#1b4d3e;--gold:#c2a14e;--bg:#eef2ee}
body{background:var(--bg);padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 9px;
 background:linear-gradient(180deg,#14402f,var(--main));border-bottom:2px solid var(--gold);box-shadow:0 2px 10px rgba(15,51,40,.18)}
header .hb{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;
 border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600}
header .hb svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
header .ht{flex:1;color:#fff;font-size:17px;font-weight:700;letter-spacing:.04em}
header .hw{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.28em;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
body.is-home header{display:none}
main{padding:10px 10px 0}
main.enter{animation:fadeup .28s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section.card{border:0;border-radius:14px;box-shadow:0 1px 2px rgba(15,51,40,.06),0 6px 18px rgba(15,51,40,.07);padding:14px}
h2{border-left:0;padding-left:0;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--deep)}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--gold),#a8822c)}
.btn{border-radius:10px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn.w{box-shadow:none}
input,select,textarea{border-radius:10px;border-color:#d3dbd4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(27,77,62,.15)}
.fld,.ls{border:0;border-radius:14px;box-shadow:0 1px 2px rgba(15,51,40,.06),0 6px 18px rgba(15,51,40,.07)}
.gbar select,.gbar button{border-radius:10px}
#toast{bottom:calc(28px + env(safe-area-inset-bottom));background:rgba(20,30,25,.92);border-radius:999px;padding:10px 18px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ===== 試合履歴 ===== */
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eceee9;color:#66706b;white-space:nowrap}
.st.ok{background:#e3f1e6;color:#1e7a45}.st.live{background:#fbe9e7;color:#b03a2e}
.gsel{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #d3dbd4;border-radius:10px;padding:0 10px;height:34px;font-size:14px;color:#222;font-weight:600}
.gsel span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsel svg{width:16px;height:16px;fill:none;stroke:var(--main);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gtool{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gtool .gcount{flex:1;text-align:center;font-size:13px;color:#667}
.gtool .btn,.gac .btn{display:inline-flex;align-items:center;gap:4px}
.gtool svg,.gac svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.4}
.gclean{width:100%;border:1px dashed #c9b27a;background:#fbf7ea;color:#7a6224;border-radius:12px;padding:10px;font-size:13px;font-weight:600;margin-bottom:10px}
.gmh{font-size:12px;font-weight:800;color:#7a8a80;letter-spacing:.08em;margin:14px 4px 6px}
.gmh:first-child{margin-top:2px}
.gi{background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,51,40,.06),0 4px 14px rgba(15,51,40,.06);overflow:hidden;cursor:pointer;
 border:1.5px solid transparent;transition:border-color .15s}
.gi.cur{border-color:rgba(194,161,78,.55)}
.gi.chk{border-color:var(--err);background:#fff6f5}
.gtop{display:flex;align-items:center;gap:12px;padding:12px 14px}
.gdate{flex:0 0 46px;height:50px;border-radius:12px;background:linear-gradient(160deg,#245e4b,#123d30);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.gdate b{font-size:20px}.gdate small{font-size:10px;color:#e6d39b}
.gmain{flex:1;min-width:0}
.gname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{font-size:12px;color:#7a837e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.gi .st{flex:0 0 auto}
.nowtag{position:absolute;opacity:0}
.gi.cur .gtop{position:relative}
.gi.cur .gtop::after{content:"表示中";position:absolute;top:4px;right:10px;font-size:9px;color:#a8822c;font-weight:800;letter-spacing:.1em}
.cb{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #c8cfca}
.gi.chk .cb{border-color:var(--err);background:var(--err);box-shadow:inset 0 0 0 3px #fff}
.glu{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:4px 16px 10px 16px;border-top:1px solid #eef1ee;font-size:14px;animation:fadeIn .25s ease}
.glu div{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dotted #e6ebe7}
.glu b{width:22px;color:var(--main)}
.glu .gp{width:28px;font-size:12px;font-weight:700;color:#8a6d1c}
.gac{display:flex;gap:8px;justify-content:space-between;padding:4px 14px 14px}
#snack{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140%);display:flex;align-items:center;gap:14px;
 background:#1d2b25;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:30;
 transition:transform .3s cubic-bezier(.2,.85,.25,1);white-space:nowrap}
#snack.on{transform:translate(-50%,0)}
#snack button{border:0;background:var(--gold);color:#1d2b25;font-weight:800;border-radius:10px;padding:7px 12px;font-size:13px}
.home .sec button{flex-direction:column;padding:10px 4px 9px;font-size:12px;gap:4px;white-space:nowrap}
.home .sec svg{width:21px;height:21px}

/* ===== チームロゴ ===== */
.home .emb.lg,.bprev .emb.lg{display:flex;align-items:center;justify-content:center;overflow:hidden}
.home .emb.lg img{width:76%;height:76%;object-fit:contain}
.emb.lgreen{background:radial-gradient(circle at 50% 35%,#2a6b55,#0f3328)}
.emb.lw{background:#fff}
.home .wm2{display:flex;flex-direction:column;align-items:center;gap:6px}
.home .wm2 .bn{letter-spacing:.16em;padding-left:.16em;color:#fbf7ea;line-height:1.05;white-space:nowrap}
.home .wm2 .du{font-size:20px;letter-spacing:.5em;padding-left:.5em;color:var(--gold)}
.home .hedit{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;width:38px;height:38px;border-radius:50%;
 border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;padding:0}
.home .hedit svg{width:18px;height:18px}
.bprev{border-radius:14px;overflow:hidden;margin-bottom:12px}
.home.mini{min-height:0;height:auto;padding:22px 10px 20px;align-items:center;text-align:center;justify-content:center}
.home.mini .emb{width:72px;height:72px;border-radius:17px;animation:none}
.home.mini .wm{margin-top:12px;font-size:30px;animation:none}
.home.mini .wm2 .du{font-size:15px}
.home.mini .tgl,.home.mini .tm{animation:none}
.home.mini .tm{margin-top:10px}
.seg2{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:#555}
.seg2 button{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:999px;padding:5px 14px;font-size:13px}
.seg2 button.on{background:var(--main);color:#fff}

/* ===== 画面切り替え ===== */
main.go-in{animation:slideIn .42s cubic-bezier(.2,.85,.25,1)}
header.go-in{animation:fadeIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.gbar .plus{font-size:20px;font-weight:700;padding:0 12px;line-height:1}

/* ===== タイトル画面 ===== */
html{background:var(--deep)}
body.is-home{background:var(--deep);position:fixed;inset:0;overflow:hidden;padding:0;overscroll-behavior:none;touch-action:manipulation}
html:has(body.is-home){overflow:hidden;overscroll-behavior:none}
body.is-home main#app{position:absolute;inset:0;padding:0;overflow:hidden}
body.is-home .home{height:100%;min-height:0;touch-action:none}
body.is-home .home button{touch-action:manipulation}
body.is-home main{padding:0;max-width:none}
.home{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#fff;
 background:radial-gradient(130% 80% at 50% 18%,#2f735b 0%,#18493b 42%,var(--deep) 85%);
 padding:calc(20px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom))}
.home .glow{position:absolute;left:50%;top:22%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;
 background:radial-gradient(circle,rgba(194,161,78,.22),rgba(194,161,78,0) 65%);pointer-events:none}
.home .hfield{position:absolute;left:0;top:4%;width:100%;height:70%;fill:none;stroke:rgba(255,255,255,.055);stroke-width:1.2;pointer-events:none}
.home .hero{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 0 20px}
.home .emb{width:104px;height:104px;border-radius:24px;box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.1);animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
.home .wm{margin-top:22px;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:42px;letter-spacing:.26em;padding-left:.26em;

<body>
<header id="hdr"><button class="hb" data-tab="home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>ホーム</button><div class="ht" id="hTitle"></div><div class="hw" id="hWord">DUGOUT</div></header>
<main id="app"></main>
<div id="toast"></div>
<div id="snack"><span id="snackTx"></span><button data-act="undoDel">元に戻す</button></div>
<input type="file" id="fileIn" style="display:none">
<input type="file" id="logoIn" accept="image/*" style="display:none">

<script>
"use strict";
/* ===== 定数 ===== */
const KEY = "sb-order-v1";
const POS = { "1":"投","2":"捕","3":"一","4":"二","5":"三","6":"遊","7":"左","8":"中","9":"右","DP":"DP","PH":"代打","PR":"代走" };
const POS_START = ["1","2","3","4","5","6","7","8","9","DP"];
const POS_SUB   = ["1","2","3","4","5","6","7","8","9","DP","PH","PR"];
const BT = ["右投右打","右投左打","右投両打","左投左打","左投右打","左投両打"];
const KINDS = ["代打","代走","守備交代","守備位置変更"];

/* ===== 保存・読込 ===== */
let S;
function blankGame(){
  return { id: uid(), date: today(), title: "", opp: "", place: "", side: "先攻", useDP: false,
    lineup: Array.from({length:9}, () => ({pid:"", pos:""})), flex: {pid:"", pos:""}, subs: [] };
}
function load(){
  try { const t = localStorage.getItem(KEY); if (t) S = JSON.parse(t); } catch(e) {}
  normalize();
}
function normalize(){
  if (!S || !Array.isArray(S.players)) S = { team: "", players: [], games: [], cur: "", tab: "players" };
  if (!S.games.length){ const g = blankGame(); S.games.push(g); S.cur = g.id; }
  if (!S.games.find(g => g.id === S.cur)) S.cur = S.games[0].id;
  if (S.tab === "subs" || S.tab === "sheet") S.tab = "order";
  if (!S.year){ const d = new Date(); S.year = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("保存できませんでした（ブラウザの設定を確認）"); }
}

/* ===== 小道具 ===== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function P(id){ return S.players.find(p => p.id === id); }
function surname(n){ const t = String(n||"").trim(); const m = t.split(/[\s\u3000]+/); return m[0] || t; }
function pname(id){ const p = P(id); return p ? p.name : ""; }
function pnum(id){ const p = P(id); return p ? p.num : ""; }
function plabel(id){ const p = P(id); return p ? (p.num !== "" ? "#"+p.num+" " : "") + p.name : "—"; }
function posLabel(k){ if (!k) return "—"; return /^\d$/.test(k) ? k+" "+POS[k] : POS[k]; }
function sortedPlayers(){ return S.players.filter(p => !p.grad).sort((a,b) => (Number(a.num)||999) - (Number(b.num)||999) || a.name.localeCompare(b.name,"ja")); }
function G(){ return S.games.find(g => g.id === S.cur); }
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 1800); }
function fmtDate(d){ if (!d) return ""; const [y,m,dd] = d.split("-"); const w = "日月火水木金土"[new Date(d).getDay()]; return `${Number(m)}/${Number(dd)}(${w})`; }
function gameTitle(g){ return [fmtDate(g.date), g.title, g.opp ? "vs "+g.opp : ""].filter(Boolean).join(" "); }

/* ===== オーダーのチェック ===== */
function validate(g){
  const errs = [];
  const slots = g.lineup.map((s,i) => ({...s, label: (i+1)+"番"}));
  if (g.useDP) slots.push({...g.flex, label:"FLEX"});
  const empty = slots.filter(s => !s.pid).map(s => s.label);
  if (empty.length) errs.push("選手が未入力：" + empty.join("、"));
  const noPos = slots.filter(s => !s.pos).map(s => s.label);
  if (noPos.length) errs.push("守備が未入力：" + noPos.join("、"));
  const cnt = {};
  slots.forEach(s => { if (s.pid) cnt[s.pid] = (cnt[s.pid]||0) + 1; });
  Object.keys(cnt).filter(k => cnt[k] > 1).forEach(k => errs.push(pname(k) + " が重複しています"));
  const pc = {};
  slots.forEach(s => { if (s.pos) pc[s.pos] = (pc[s.pos]||0) + 1; });
  for (let i=1;i<=9;i++){ const k = String(i);
    if ((pc[k]||0) > 1) errs.push(posLabel(k) + " が重複しています");
    if (!pc[k] && !noPos.length) errs.push(posLabel(k) + " がいません"); }
  if (g.useDP){
    if ((pc["DP"]||0) !== 1 && !noPos.length) errs.push("DPは打順の中に1人だけ入れてください");
    if (g.flex.pos === "DP") errs.push("FLEXはDP以外の守備位置にしてください");
  } else if (pc["DP"]) errs.push("DPを使う場合は「DP/FLEXを使う」をオンにしてください");
  return errs;
}

/* ===== 交代を反映した現在のオーダー（JSAオフィシャルルール準拠）=====
   ・スターティングプレイヤーは一度退いても1回に限り再出場できる。再出場は元の打順のみ
   ・控えから出場した選手は、退いたら再出場できない
   ・DPの打順は試合中変更できない（DPの役割は最初のDPの打順に固定）
   ・DPがFPの守備に就く → FPは退いたことになる（9人）
   ・FPがDPの打順で打つ → DPは退いたことになる（9人）。DPが再出場するとFPは守備専門に戻る
   ・DPがFP以外の選手の守備に就く → その選手は打撃のみ（OPO）として残る
   ・FPの再出場は、守備専門に戻るか、DPの打順に入る（打撃と守備を兼ねる）
   ・DPとFPは同時に攻撃できない／FPを打撃のみにはできない
   ・兼務中の選手と交代した選手は、その兼務を引き継ぐ */
function computeCurrent(g){
  const slots = g.lineup.map(s => ({pid:s.pid, pos:s.pos, re:false}));
  const flex = g.useDP ? {pid:g.flex.pid, pos:g.flex.pos, re:false} : null;
  const dpSlot = g.useDP ? g.lineup.findIndex(s => s.pos === "DP") : -1;
  const starters = {};
  slots.forEach((s,i) => { if (s.pid) starters[s.pid] = String(i); });
  if (flex && flex.pid) starters[flex.pid] = "F";
  const out = new Set(), reentered = new Set(), everIn = new Set(Object.keys(starters));
  const warns = [], evNotes = [];
  let fpInSlot = null;   // DPの打順に入っているFP
  const inGame = id => slots.some(s => s.pid === id) || (flex && flex.pid === id);
  const slotName = k => k === "F" ? "FP" : (Number(k)+1) + "番";
  g.subs.forEach((e, idx) => {
    const lb = `【${idx+1}】${e.inn}回`, err = m => warns.push(`${lb}：${m}`);
    const tgt = e.slot === "F" ? flex : slots[Number(e.slot)];
    let note = "";
    if (!tgt){ err("対象の打順がありません"); evNotes.push(""); return; }
    if (e.kind === "守備位置変更"){
      if (tgt === flex && e.pos === "DP") err("FPを打撃のみにはできません");
      if (tgt === flex && !tgt.pid) err("FPは出場していません");
      tgt.pos = e.pos || ""; evNotes.push(""); return;
    }
    if (e.kind === "FP打撃"){
      if (!flex || !flex.pid) err("FPが出場していません");
      else if (Number(e.slot) !== dpSlot) err("FPが打てるのはDPの打順だけです");
      else {
        if (tgt.pid) out.add(tgt.pid);
        tgt.pid = flex.pid; tgt.pos = flex.pos; fpInSlot = flex.pid; flex.pid = ""; flex.pos = "";
      }
      evNotes.push("DP退く"); return;
    }
    if (e.kind === "DP守備"){
      if (!flex || !flex.pid) err("FPが出場していません");
      else if (Number(e.slot) !== dpSlot) err("DPの打順ではありません");
      else { tgt.pos = flex.pos; out.add(flex.pid); flex.pid = ""; flex.pos = ""; }
      evNotes.push("FP退く"); return;
    }
    const inP = e.pid, prev = tgt.pid;
    if (!inP){ evNotes.push(""); return; }
    if (inGame(inP)) err(`${pname(inP)} は出場中です`);
    if (starters[inP] !== undefined){
      if (out.has(inP)){
        if (reentered.has(inP)) err(`${pname(inP)} はすでに再出場しています（再出場は1回まで）`);
        const ok = starters[inP] === String(e.slot) || (starters[inP] === "F" && Number(e.slot) === dpSlot);
        if (!ok) err(`${pname(inP)} は元の打順（${slotName(starters[inP])}）にしか戻れません`);
        reentered.add(inP); out.delete(inP); note = "リエントリー";
      }
    } else if (everIn.has(inP)) err(`${pname(inP)} は控えから出場して退いたため、再出場できません`);
    everIn.add(inP);
    // 空いたFP枠に入る（FPの再出場・新たなFP）→ DPは打撃専門に戻る
    if (tgt === flex && !prev){
      const dp = slots[dpSlot];
      if (!dp || !/^\d$/.test(dp.pos)) err("FPが入る守備位置がありません");
      else { flex.pid = inP; flex.pos = dp.pos; dp.pos = "DP"; }
      flex.re = note === "リエントリー"; evNotes.push(note || "FP"); return;
    }
    // DPの打順でFPが打っているところへDPが再出場 → FPは守備専門に戻る
    if (Number(e.slot) === dpSlot && fpInSlot && prev === fpInSlot && flex && !flex.pid){
      flex.pid = prev; flex.pos = tgt.pos; tgt.pid = inP; tgt.pos = "DP"; tgt.re = note === "リエントリー"; fpInSlot = null;
      evNotes.push((note ? note + "・" : "") + "FPは守備専門に戻る"); return;
    }
    if (prev && prev !== inP) out.add(prev);
    if (prev === fpInSlot) fpInSlot = null;
    tgt.pid = inP; tgt.re = note === "リエントリー";
    if (e.pos) tgt.pos = e.pos;
    else if (tgt.pos !== "DP"){ if (e.kind === "代打") tgt.pos = "PH"; else if (e.kind === "代走") tgt.pos = "PR"; else if (tgt.pos === "PH" || tgt.pos === "PR") tgt.pos = ""; }
    evNotes.push(note);
  });
  // 今の状態のチェック（守備が決まるまでの途中は「未完了」として表示）
  const info = [];
  const all = slots.concat(flex && flex.pid ? [flex] : []);
  for (let i = 1; i <= 9; i++){
    const n = all.filter(s => s.pid && s.pos === String(i)).length;
    if (n === 0) info.push(posLabel(String(i)) + " が空いています");
    if (n > 1) info.push(posLabel(String(i)) + " が重複しています");
  }
  const batOnly = slots.filter(s => s.pid && s.pos === "DP");
  if (batOnly.length > 1) info.push("打撃のみの選手が2人います");
  if (batOnly.length && !(flex && flex.pid)) info.push(`FPがいないため ${pname(batOnly[0].pid)} を守備に就けてください`);
  const ph = slots.filter(s => s.pid && (s.pos === "PH" || s.pos === "PR"));
  if (ph.length) info.push("代打・代走の選手の守備が未定です：" + ph.map(s => pname(s.pid)).join("、"));
  return { slots, flex, out, warns, info, evNotes, starters, reentered, dpSlot };
}

/* ===== テンポラリーランナー（捕手の臨時代走） =====
   二死で捕手が走者のとき（二死後に捕手が出塁したときも）、攻撃側の選択で使える。
   走るのは、塁上の走者以外で、打順が最後に回ってくる選手。交代には数えない。 */
let tr = null;
function trHtml(){
  if (!tr) return "";
  const g = G(), c = computeCurrent(g);
  const ci = c.slots.findIndex(s => s.pos === "2");
  let body;
  if (ci < 0) body = `<p>打順の中に捕手がいません${c.flex && c.flex.pos === "2" ? "（捕手がFPのため、捕手は打席に立たず走者になりません）" : ""}。</p>`;
  else {
    let ans = -1;
    for (let k = 1; k <= 9; k++){ const j = (tr.next - k + 9) % 9; if (j !== ci && !tr.on.has(j) && j !== tr.next){ ans = j; break; } }
    body = `<div class="am" style="text-align:left">「次の打者」と「塁上の走者」を選んでください（捕手 ${esc(pname(c.slots[ci].pid))} は走者として扱います）</div>
    <table class="trt">${c.slots.map((s,i) => `<tr><td class="num">${i+1}</td><td>${esc(pname(s.pid))}${i===ci?`<span class="tag">捕手</span>`:""}</td>
      <td><button class="btn s ${tr.next===i?"":"w"}" data-act="trNext" data-i="${i}">次打者</button></td>
      <td>${i===ci?"":`<button class="btn s ${tr.on.has(i)?"":"w"}" data-act="trOn" data-i="${i}">塁上</button>`}</td></tr>`).join("")}</table>
    <div class="at" style="margin-top:6px">臨時代走：<b>${ans >= 0 ? `${ans+1}番 ${esc(pname(c.slots[ans].pid))}` : "該当者なし"}</b></div>
    <div class="am">交代ではないので記録はしません</div>`;
  }
  return `<div class="ov"><div class="ask">${body}<button class="btn w" data-act="trClose">閉じる</button></div></div>`;
}
/* ===== ルール違反のお知らせ ===== */
let notice = null;
function noticeHtml(){
  if (!notice) return "";
  return `<div class="ov" style="align-items:center"><div class="ask" style="border-radius:14px;margin:16px">
    <div class="at" style="color:var(--err);font-weight:bold">ルール上できない交代です</div>
    <div style="font-size:14px;line-height:1.6">${notice.map(esc).join("<br>")}</div>
    <div class="am">記録していません（日本ソフトボール協会オフィシャルルール）</div>
    <button class="btn" data-act="noticeOk">OK</button></div></div>`;
}
/* ===== 描画 ===== */
function render(){
  const g = G();
  const home = S.tab === "home";
  document.body.classList.toggle("is-home", home);
  document.getElementById("hWord").textContent = (brand().name ? brand().name + " " : "") + "DUGOUT";
  document.getElementById("hTitle").textContent = {players:"選手登録", order:"オーダー", data:"データ", games:"試合履歴"}[S.tab] || "";
  const app = document.getElementById("app");
  app.innerHTML = (home ? vHome() : ({players: vPlayers, order: vOrder, data: vData, games: vGames}[S.tab] || vOrder)()) + noticeHtml() + trHtml();
  if (render.last !== S.tab){
    const cls = home ? "go-home" : "go-in", hdr = document.getElementById("hdr");
    app.classList.remove("go-home","go-in"); hdr.classList.remove("go-in"); void app.offsetWidth;
    if (render.last !== undefined || home){ app.classList.add(cls); if (!home) hdr.classList.add("go-in"); }
    render.last = S.tab;
  }
}

function playerOptions(sel, excludeIds){
  const ex = new Set(excludeIds || []);
  return `<option value="">—</option>` + sortedPlayers().map(p =>
    `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc((p.num!==""?"#"+p.num+" ":"") + p.name)}${ex.has(p.id)&&p.id!==sel?" ●":""}</option>`).join("");
}
function posOptions(list, sel){
  return `<option value="">—</option>` + list.map(k => `<option value="${k}" ${k===sel?"selected":""}>${posLabel(k)}</option>`).join("");
}

/* --- チームのブランド（ロゴ・略称） --- */
function brand(){ return S.brand || (S.brand = { name: "", logo: "", bg: "green" }); }
let brandImg = null;
function loadBrandImg(){ const b = brand(); brandImg = null; if (b.logo){ brandImg = new Image(); brandImg.src = b.logo; } }
function emblemHtml(cls){
  const b = brand();
  if (!b.logo) return `<img src="icon-180.png" alt="" class="${cls}">`;
  return `<span class="${cls} lg ${b.bg === "white" ? "lw" : "lgreen"}"><img src="${b.logo}" alt=""></span>`;
}
function wordmarkHtml(){
  const n = (brand().name || "").trim();
  if (!n) return `<div class="wm">DUGOUT</div>`;
  const w = [...n].reduce((a,c) => a + (/[ -~]/.test(c) ? 1 : 1.7), 0);   // 全角は幅広
  const fs = Math.max(20, Math.min(42, Math.floor(300 / (w * 1.22))));
  return `<div class="wm wm2"><span class="bn" style="font-size:${fs}px">${esc(n)}</span><span class="du">DUGOUT</span></div>`;
}
/* ロゴからホーム画面用アイコンを作る（iPhoneのSafariで追加するとき用） */
function brandIcon(size){
  const b = brand(); if (!b.logo || !brandImg || !brandImg.complete || !brandImg.naturalWidth) return null;
  const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
  if (b.bg === "white"){ x.fillStyle = "#fff"; x.fillRect(0,0,size,size); }
  else { const gr = x.createRadialGradient(size/2, size*.35, 0, size/2, size/2, size*.75); gr.addColorStop(0,"#2a6b55"); gr.addColorStop(1,"#0f3328"); x.fillStyle = gr; x.fillRect(0,0,size,size); }
  const pad = size * .14, box = size - pad*2, r = Math.min(box / brandImg.naturalWidth, box / brandImg.naturalHeight);
  const w = brandImg.naturalWidth * r, h = brandImg.naturalHeight * r;
  x.drawImage(brandImg, (size-w)/2, (size-h)/2, w, h);
  return c.toDataURL("image/png");
}
function applyBrandIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"]');
  const d = brandIcon(180);
  l.href = d || "icon-180.png";
  document.title = (brand().name ? brand().name + " " : "") + "DUGOUT｜ソフトボール オーダー管理";
}

/* --- ホーム（タイトル画面） --- */
const ICON = {
  order: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 10.5h7M8.5 13.5h7M8.5 16.5h4.5"/></svg>',

/* ===== ドラッグ・タップで入れ替え ===== */
let pick = null;
const undoStack = [];
function slotRef(g, v){ return v === "F" ? g.flex : g.lineup[Number(v)]; }
function holderKey(slots, flex, k){ const i = slots.findIndex(s => s.pos === k); if (i >= 0) return String(i); return flex && flex.pos === k ? "F" : null; }
/* src/dst を「どの打順か」に直す */
function resolve(x, slots, flex){
  if (x.t === "slot" || x.t === "lpos") return {slot: String(x.v)};
  if (x.t === "pos") return {slot: holderKey(slots, flex, x.v), pos: x.v};
  if (x.t === "bench") return {pid: x.v};

    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>",
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    null
  ];
  objs.forEach((o, i) => {
    offs.push(len);
    if (o !== null) push(enc(`${i+1} 0 obj\n${o}\nendobj\n`));
    else {
      push(enc(`${i+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`));
      push(img); push(enc("\nendstream\nendobj\n"));
    }
  });
  const xref = len;
  let t = `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10,"0") + " 00000 n \n").join("");
  t += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  push(enc(t));
  return new Blob(parts, {type: "application/pdf"});
}
function exportPdf(){
  const g = G();
  const name = `メンバー表_${g.date || today()}${g.opp ? "_" + g.opp : ""}${isLive() ? "_現在" : ""}.pdf`.replace(/[\\/:*?"<>|]/g, "");
  const blob = makePdf(drawSheet());
  const file = new File([blob], name, {type: "application/pdf"});
  if (navigator.canShare && navigator.canShare({files: [file]})){
    navigator.share({files: [file], title: name}).catch(() => {});
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===== 操作 ===== */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-tab],[data-act]");
  if (!b || b.tagName === "SELECT" || b.type === "checkbox") return;
  if (b.dataset.tab){ S.tab = b.dataset.tab; editId = ""; pick = null; gSel = null; gOpen = b.dataset.tab === "games" ? S.cur : gOpen; save(); render(); window.scrollTo(0,0); return; }
  const g = G(), a = b.dataset.act;
  if (a === "savePlayer"){
    const name = document.getElementById("fName").value.trim();
    if (!name) return toast("名前を入れてください");
    const num = document.getElementById("fNum").value.trim();
    if (num !== "" && S.players.some(p => p.num === num && p.id !== editId)) return toast("背番号 " + num + " は使われています");
    const d = { num, name, grade: document.getElementById("fGrade").value, bt: document.getElementById("fBt").value, memo: document.getElementById("fMemo").value.trim() };
    if (editId) Object.assign(P(editId), d); else S.players.push({ id: uid(), ...d });
    toast(editId ? "更新しました" : "登録しました"); editId = "";
  }
  else if (a === "editPlayer"){ editId = b.dataset.id; window.scrollTo(0,0); }
  else if (a === "cancelEdit"){ editId = ""; }
  else if (a === "delPlayer"){
    const id = b.dataset.id;
    const inUse = S.games.some(x => x.lineup.some(s=>s.pid===id) || x.flex.pid===id || x.subs.some(e=>e.pid===id||e.outPid===id));
    if (!confirm(`${pname(id)} を削除しますか？` + (inUse ? "\n（過去の試合のオーダーからも消えます）" : ""))) return;
    S.players = S.players.filter(p => p.id !== id);
    S.games.forEach(x => { x.lineup.forEach(s => { if (s.pid===id) s.pid=""; }); if (x.flex.pid===id) x.flex.pid=""; x.subs = x.subs.filter(e => e.pid!==id); });
  }
  else if (a === "info"){ infoOpen = !infoOpen; render(); return; }
  else if (a === "dpToggle"){
    if (!g.useDP){ g.useDP = true; toast("DP/FPオン：打順の選手を図の「DP」へ"); }
    else {
      if ((g.flex.pid || g.lineup.some(s => s.pos === "DP")) && !confirm("DP/FPを解除しますか？（FPの選手は控えに戻ります）")) return;
      g.useDP = false; g.lineup.forEach(s => { if (s.pos === "DP") s.pos = ""; }); g.flex = {pid:"", pos:""};
    }
    pick = null;
  }
  else if (a === "noticeOk"){ notice = null; }
  else if (a === "gExpand"){ if (ev.target.closest("button")) return; gOpen = gOpen === b.dataset.id ? null : b.dataset.id; render(); return; }
  else if (a === "gToggle"){ const id = b.dataset.id; gSel.has(id) ? gSel.delete(id) : gSel.add(id); render(); return; }
  else if (a === "gSelStart"){ gSel = new Set(); gOpen = null; render(); return; }
  else if (a === "gSelCancel"){ gSel = null; render(); return; }
  else if (a === "gDelSel"){ if (!gSel.size) return; deleteGames([...gSel]); gSel = null; }
  else if (a === "delOne"){ const x = S.games.find(y => y.id === b.dataset.id); if (!confirm(`「${gameTitle(x) || "無題の試合"}」を削除しますか？`)) return; deleteGames([x.id]); gOpen = null; }
  else if (a === "gDelEmpty"){ deleteGames(S.games.filter(isEmptyGame).map(x => x.id)); }
  else if (a === "undoDel"){ if (!delBak) return; S.games = delBak.games; S.cur = delBak.cur; delBak = null; document.getElementById("snack").classList.remove("on"); toast("元に戻しました"); }
  else if (a === "newGame2"){ const n = blankGame(); S.games.push(n); S.cur = n.id; S.mode = "edit"; infoOpen = true; pick = null; toast("新しい試合を作りました。試合情報を入力してください"); }
  else if (a === "homeNew"){ const n = blankGame(); S.games.push(n); S.cur = n.id; S.tab = "order"; S.mode = "edit"; infoOpen = true; toast("新しい試合を作りました"); }
  else if (a === "openGame"){ S.cur = b.dataset.id; S.tab = "order"; pick = null; window.scrollTo(0,0); }
  else if (a === "trOpen"){ const c = computeCurrent(g); tr = { next: 0, on: new Set() }; }
  else if (a === "trClose"){ tr = null; }
  else if (a === "trNext"){ tr.next = Number(b.dataset.i); tr.on.delete(tr.next); }
  else if (a === "trOn"){ const i = Number(b.dataset.i); if (tr.on.has(i)) tr.on.delete(i); else if (i !== tr.next) tr.on.add(i); }
  else if (a === "mode2"){ S.mode = b.dataset.m; pick = null; }
  else if (a === "inn"){ g.inn = Math.min(20, Math.max(1, (g.inn||1) + Number(b.dataset.d))); }
  else if (a === "askKind"){
    const k = b.dataset.k;
    if (k){
      const c = computeCurrent(g), cur = ask.slot === "F" ? c.flex : c.slots[Number(ask.slot)];
      const pos = k === "守備交代" ? (/^\d$/.test(cur.pos) ? cur.pos : "") : "";
      g.subs.push({inn: g.inn||1, kind: k, slot: ask.slot, pid: ask.pid, pos, outPid: cur.pid, b: Date.now()});
      afterGame(c);
    }
    ask = null;
  }
  else if (a === "undo" && isLive()){
    const lb = g.subs.length ? g.subs[g.subs.length-1].b : undefined;
    if (lb === undefined) g.subs.pop(); else g.subs = g.subs.filter(e => e.b !== lb);
    pick = null; toast("1つ前の操作を取り消しました");
  }
  else if (a === "undo"){
    for (let i = undoStack.length - 1; i >= 0; i--) if (undoStack[i].gid === g.id){
      const d = JSON.parse(undoStack.splice(i,1)[0].data); g.lineup = d.lineup; g.flex = d.flex; break; }
    pick = null;
  }
  else if (a === "yearUp"){
    const cur = sortedPlayers(), g3 = cur.filter(p => p.grade === "3");
    if (!confirm(`${S.year+1}年度に更新します。\n3年生 ${g3.length}人は卒業として一覧から消えます。\n${g3.map(p=>p.name).join("、")}\n\nよろしいですか？`)) return;
    S.yearBak = { year: S.year, players: JSON.parse(JSON.stringify(S.players)) };
    S.year += 1;
    cur.forEach(p => { if (p.grade === "3") p.grad = S.year - 1; else if (p.grade === "1" || p.grade === "2") p.grade = String(Number(p.grade) + 1); });
    toast(`${S.year}年度に更新しました`);
  }
  else if (a === "yearUndo"){
    if (!confirm(`${S.yearBak.year}年度の状態に戻しますか？`)) return;
    S.players = S.yearBak.players; S.year = S.yearBak.year; delete S.yearBak; toast("元に戻しました");
  }
  else if (a === "purgeGrads"){
    const ids = S.players.filter(p => p.grad).map(p => p.id);
    if (!confirm(`卒業生 ${ids.length}人を完全に削除します。過去の試合記録からも名前が消えます。よろしいですか？`)) return;
    S.players = S.players.filter(p => !p.grad);
    S.games.forEach(x => { x.lineup.forEach(s => { if (ids.includes(s.pid)) s.pid = ""; }); if (ids.includes(x.flex.pid)) x.flex.pid = ""; x.subs = x.subs.filter(e => !ids.includes(e.pid)); });
    delete S.yearBak; toast("削除しました");
  }
  else if (a === "newGame"){ const n = blankGame(); S.games.push(n); S.cur = n.id; toast("新しい試合を作りました"); }
  else if (a === "copyGame"){
    const n = JSON.parse(JSON.stringify(g)); n.id = uid(); n.date = today(); n.opp = ""; n.subs = []; n.inn = 1;
    const gone = id => id && (!P(id) || P(id).grad);
    n.lineup.forEach(s => { if (gone(s.pid)) s.pid = ""; }); if (gone(n.flex.pid)) n.flex.pid = "";
    S.games.push(n); S.cur = n.id; toast("コピーしました（交代記録は空）");
  }
  else if (a === "delGame"){
    if (!confirm("この試合を削除しますか？")) return;
    S.games = S.games.filter(x => x.id !== g.id);
    if (!S.games.length) S.games.push(blankGame());
    S.cur = S.games[0].id;
  }
  else if (a === "addSub"){
    const e = { inn: Number(document.getElementById("sInn").value)||1, kind: document.getElementById("sKind").value,
      slot: document.getElementById("sSlot").value, pid: document.getElementById("sPid").value, pos: document.getElementById("sPos").value };
    const c = computeCurrent(g);
    const tgt = e.slot === "F" ? c.flex : c.slots[Number(e.slot)];
    if (e.kind === "守備位置変更"){ if (!e.pos) return toast("守備位置を選んでください"); e.pid = ""; e.outPid = ""; }
    else {
      if (!e.pid) return toast("入る選手を選んでください");
      if (e.pid === tgt.pid) return toast("同じ選手です");
      if (e.kind === "守備交代" && !e.pos) return toast("守備位置を選んでください");
      e.outPid = tgt.pid;
    }
    e.b = Date.now(); g.subs.push(e);
    afterGame(c);
  }
  else if (a === "delSub"){ if (!confirm("この交代を取り消しますか？")) return; g.subs.splice(Number(b.dataset.i), 1); }
  else if (a === "copyText"){ copyText(sheetText()); return; }
  else if (a === "pdf"){ if (!isLive() && validate(g).length && !confirm("オーダーに未入力・重複があります。このままPDFにしますか？")) return; exportPdf(); return; }
  else if (a === "saveTeam"){ S.team = document.getElementById("teamName").value.trim(); brand().name = document.getElementById("brandName").value.trim(); toast("保存しました"); }
  else if (a === "toBrand"){ S.tab = "data"; save(); render(); setTimeout(() => document.getElementById("brandCard")?.scrollIntoView({behavior:"smooth"}), 50); return; }
  else if (a === "pickLogo"){ document.getElementById("logoIn").click(); return; }
  else if (a === "delLogo"){ if (!confirm("ロゴ画像を外しますか？")) return; brand().logo = ""; loadBrandImg(); applyBrandIcon(); }
  else if (a === "logoBg"){ brand().bg = b.dataset.v; setTimeout(applyBrandIcon, 50); }
  else if (a === "export"){ exportData(); return; }
  else if (a === "import"){ document.getElementById("fileIn").click(); return; }
  else if (a === "copyAll"){ S.lastBackup = today(); save(); copyText(JSON.stringify(S)); return; }
  else if (a === "pasteImport"){ const t = document.getElementById("pasteBox").value; if (!t.trim()) { toast("先に貼り付けてください"); return; } importText(t); return; }
  else if (a === "wipe"){
    if (!confirm("すべてのデータを削除します。元に戻せません。よろしいですか？")) return;
    S = null; try { localStorage.removeItem(KEY); } catch(e) {} normalize(); toast("削除しました");
  }
  else return;
  save(); render();
});

/* ===== コピー・書き出し・読み込み ===== */
function copyText(text){
  const done = () => toast("コピーしました");
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("コピーしました"); } catch(e) { toast("コピーできませんでした"); }
  ta.remove();
}
function exportData(){
  S.lastBackup = today(); save();
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dugout-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importText(text){
  let d;
  try {
    let t = String(text || "").replace(/^\uFEFF/, "").trim();
    const i = t.indexOf("{"), j = t.lastIndexOf("}");
    if (i < 0 || j < 0) throw 0;
    d = JSON.parse(t.slice(i, j + 1));
    if (!Array.isArray(d.players) || !Array.isArray(d.games)) throw 0;
  } catch(e){ toast("このデータは読み込めません"); return false; }
  const n = d.players.filter(p => !p.grad).length;
  if (!confirm(`選手${n}人・試合${d.games.length}件のデータを読み込みます。\n今このアプリに入っているデータは置き換わります。よろしいですか？`)) return false;
  S = d; normalize(); S.tab = "players"; loadBrandImg(); if (brandImg) brandImg.onload = applyBrandIcon; save(); render(); toast("読み込みました");
  return true;
}
document.getElementById("fileIn").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => importText(r.result);
  r.onerror = () => toast("ファイルを開けませんでした");
  r.readAsText(f); ev.target.value = "";
});
document.getElementById("logoIn").addEventListener("change", ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const M = 400, r = Math.min(1, M / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * r); c.height = Math.round(im.naturalHeight * r);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    brand().logo = c.toDataURL("image/png"); URL.revokeObjectURL(url);
    loadBrandImg(); brandImg.onload = applyBrandIcon;
    save(); render(); toast("ロゴを設定しました");
  };
  im.onerror = () => toast("この画像は読み込めません");
  im.src = url;
});
/* ===== 起動 ===== */
load(); S.tab = "home"; loadBrandImg(); if (brandImg) brandImg.onload = applyBrandIcon; else applyBrandIcon(); render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
